<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZE-POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ZE-POS - Create Account</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">🍽</div>
            <h1 class="login-title">Create Your Account</h1>
            <p class="login-subtitle">Start your cloud POS — monthly subscription</p>

            <div id="regError" class="login-error" style="display:none;">
                Something went wrong.
            </div>
            <div id="regSuccess" class="login-success" style="display:none;">
                Account created! Check your email for a confirmation link, then sign in.
            </div>

            <form class="login-form" id="regForm">
                <div class="form-group">
                    <label for="businessName">Business Name</label>
                    <input type="text" id="businessName" placeholder="e.g. ZE-POS" required autocomplete="organization">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="you@business.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-login" id="regBtn">Create Account</button>
            </form>

            <div class="login-hint">
                Already have an account? <a href="login.html"><strong>Sign in</strong></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function () {
            Supabase.init();

            // Already signed in? Go straight to the app.
            const session = await Supabase.getSession();
            if (session) {
                window.location.href = 'app.html';
                return;
            }

            const errorEl = document.getElementById('regError');
            const successEl = document.getElementById('regSuccess');
            const btn = document.getElementById('regBtn');
            const countdownEl = document.createElement('div');
            countdownEl.className = 'login-error';
            countdownEl.style.display = 'none';
            errorEl.parentNode.insertBefore(countdownEl, errorEl.nextSibling);

            document.getElementById('regForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const businessName = document.getElementById('businessName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regConfirm').value;
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (password !== confirm) {
                    errorEl.textContent = 'Passwords do not match.';
                    errorEl.style.display = 'block';
                    return;
                }

                // Check lockout (client + server)
                const check = await Lockout.preCheck('reg', email);
                if (check.locked) {
                    Lockout.startCountdown(countdownEl, check.lockedUntil);
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Creating account…';
                const { user, error } = await Supabase.signUp({ email, password, businessName });
                btn.disabled = false;
                btn.textContent = 'Create Account';

                if (error) {
                    const rec = await Lockout.record('reg', email);
                    if (rec.locked) {
                        Lockout.startCountdown(countdownEl, rec.lockedUntil);
                    }
                    errorEl.textContent = error.message || 'Could not create your account.';
                    errorEl.style.display = 'block';
                    return;
                }

                // Success — clear lockout on both sides
                await Lockout.reset('reg', email);
                countdownEl.style.display = 'none';

                // If email confirmation is off, Supabase returns a session → log straight in.
                const newSession = await Supabase.getSession();
                if (newSession) {
                    try {
                        await DB.init();
                        const { profile } = await Supabase.getProfile();
                        await Auth.setSession(profile);
                        window.location.href = 'app.html';
                        return;
                    } catch (err) {
                        window.location.href = 'app.html';
                        return;
                    }
                }

                successEl.textContent = user && user.email
                    ? `Account created! We sent a confirmation link to ${user.email}. Confirm it, then sign in.`
                    : 'Account created! Confirm your email, then sign in.';
                successEl.style.display = 'block';
            });
        })();
    </script>
</body>
</html>
