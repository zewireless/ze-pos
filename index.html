<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZE-POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <title>ZE-POS - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">🍽</div>
            <h1 class="login-title">ZE-POS</h1>
            <p class="login-subtitle">Cloud Point of Sale — sign in to your business</p>

            <div id="loginError" class="login-error" style="display:none;">
                Invalid email or password.
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@business.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div class="login-hint">
                New to ZE-POS? <a href="register.html"><strong>Create an account</strong></a><br>
                <span class="text-muted">Monthly subscription · GCash / Maya / bank accepted</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function () {
            Supabase.init();

            // Already signed in? Go straight to the app.
            const session = await Supabase.getSession();
            if (session) {
                const { profile } = await Supabase.getProfile();
                if (profile) {
                    await DB.init();
                    await Auth.setSession(profile);
                    window.location.href = Auth.isSuperAdmin() ? 'admin.html' : 'app.html';
                    return;
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('loginError');
                const btn = document.getElementById('loginBtn');
                errorEl.style.display = 'none';

                btn.disabled = true;
                btn.textContent = 'Signing in…';
                const { user, error } = await Auth.login(email, password);
                btn.disabled = false;
                btn.textContent = 'Sign In';

                if (error || !user) {
                    errorEl.textContent = 'Invalid email or password.';
                    errorEl.style.display = 'block';
                    return;
                }

                try {
                    await DB.init();
                    const { profile } = await Supabase.getProfile();
                    await Auth.setSession(profile);
                    window.location.href = Auth.isSuperAdmin() ? 'admin.html' : 'app.html';
                } catch (err) {
                    errorEl.textContent = 'Could not load your workspace: ' + (err.message || err);
                    errorEl.style.display = 'block';
                }
            });
        })();
    </script>
</body>
</html>
