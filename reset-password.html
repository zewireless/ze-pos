<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ZE-POS">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ZE-POS - Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">🍽</div>
            <h1 class="login-title">Reset Password</h1>
            <p class="login-subtitle">Enter your email and we'll send a reset link.</p>

            <div id="resetError" class="login-error" style="display:none;">
                Something went wrong.
            </div>
            <div id="resetSuccess" class="login-success" style="display:none;">
                Check your email for a password reset link.
            </div>

            <form class="login-form" id="resetForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@business.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn-login" id="resetBtn">Send Reset Link</button>
            </form>

            <div class="login-hint">
                Remembered it? <a href="index.html"><strong>Sign in</strong></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function () {
            Supabase.init();

            const errorEl = document.getElementById('resetError');
            const successEl = document.getElementById('resetSuccess');
            const btn = document.getElementById('resetBtn');
            const countdownEl = document.createElement('div');
            countdownEl.className = 'login-error';
            countdownEl.style.display = 'none';
            errorEl.parentNode.insertBefore(countdownEl, errorEl.nextSibling);

            document.getElementById('resetForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                // Check lockout (client + server)
                const check = await Lockout.preCheck('reset', email);
                if (check.locked) {
                    Lockout.startCountdown(countdownEl, check.lockedUntil);
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Sending…';

                const { error } = await Auth.requestPasswordReset(email);

                btn.disabled = false;
                btn.textContent = 'Send Reset Link';

                if (error) {
                    const rec = await Lockout.record('reset', email);
                    if (rec.locked) {
                        Lockout.startCountdown(countdownEl, rec.lockedUntil);
                    }
                    errorEl.textContent = error.message || 'Could not send reset link.';
                    errorEl.style.display = 'block';
                    return;
                }

                // Success — clear lockout on both sides.
                await Lockout.reset('reset', email);
                countdownEl.style.display = 'none';

                // Always show success to avoid user enumeration.
                successEl.style.display = 'block';
            });
        })();
    </script>
</body>
</html>
